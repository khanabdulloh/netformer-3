/* ========================================= */
/* ===== TIMELINE & CARD REDESIGN (BARU) === */
/* ========================================= */

/* Garis waktu neon di tengah */
.grid {
    display: flex;
    flex-direction: column;
    gap: 24px;
    position: relative;
    max-width: 620px;
    margin: 30px auto 0;
}
.grid::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 4px;
    background: linear-gradient(to bottom, transparent, var(--g), var(--c), var(--g), transparent);
    border-radius: 4px;
    box-shadow: 0 0 15px var(--g), 0 0 30px color-mix(in srgb, var(--g) 40%, transparent);
    transform: translateX(-50%);
    z-index: 0;
    opacity: 0.6;
}

/* Base Kartu Misi */
.grid .cd {
    width: min(100%, 420px);
    position: relative;
    z-index: 1;
    margin: 0;
    border: 1px solid var(--ln);
    background: color-mix(in srgb, var(--pn) 85%, transparent);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Zig-Zag: Ganjil kiri, Genap kanan */
.grid .cd:nth-child(odd) {
    align-self: flex-start;
}
.grid .cd:nth-child(even) {
    align-self: flex-end;
}

/* Kartu Terkunci (Disabled) */
.grid .cd:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    background: repeating-linear-gradient(
        -45deg,
        color-mix(in srgb, var(--pn) 60%, transparent),
        color-mix(in srgb, var(--pn) 60%, transparent) 10px,
        color-mix(in srgb, var(--bg) 90%, transparent) 10px,
        color-mix(in srgb, var(--bg) 90%, transparent) 20px
    );
    border-color: color-mix(in srgb, var(--ln) 50%, transparent);
    filter: grayscale(0.8);
}
.grid .cd:disabled .ic {
    box-shadow: none;
    border-color: var(--ln);
}

/* Kartu Aktif (MISI AKTIF) */
.cd.cur {
    border-color: var(--g);
    box-shadow: 0 0 0 1px var(--g), 0 0 25px -5px var(--g);
    animation: pulseGlow 2s infinite alternate;
    transform: scale(1.02);
    background: linear-gradient(135deg, color-mix(in srgb, var(--g) 10%, var(--pn)), var(--pn));
}

/* Efek Cahaya Berdenyut pada Kartu Aktif */
@keyframes pulseGlow {
    0% { box-shadow: 0 0 0 1px var(--g), 0 0 15px -5px var(--g); }
    100% { box-shadow: 0 0 0 2px var(--g), 0 0 35px -2px var(--g); }
}

/* Badge "MISI AKTIF" di Pojok Kanan Atas */
.cd.cur::after {
    content: "MISI AKTIF";
    position: absolute;
    top: 12px;
    right: 12px;
    left: auto;
    bottom: auto;
    padding: 4px 12px;
    border-radius: 6px;
    background: var(--g);
    color: var(--ink);
    font: 800 10px Orbitron, sans-serif;
    letter-spacing: 0.12em;
    box-shadow: 0 0 12px var(--g);
    animation: blinkBadge 1.5s infinite;
}

@keyframes blinkBadge {
    50% { opacity: 0.7; }
}

/* Ikon Misi */
.cd .ic {
    position: relative;
    z-index: 2;
    transition: transform 0.3s;
}
.cd:hover:not(:disabled) .ic {
    transform: scale(1.1) rotate(-5deg);
}

/* Efek Shine (Kilau) saat Hover */
.cd::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(115deg, transparent 30%, color-mix(in srgb, var(--g) 30%, transparent) 50%, transparent 70%);
    transform: translateX(-120%);
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 0;
}
.cd:hover:not(:disabled)::before {
    transform: translateX(120%);
}

/* Teks di dalam kartu */
.cd h3, .cd p {
    position: relative;
    z-index: 2;
}
.cd .tag {
    position: relative;
    z-index: 2;
    display: inline-block;
    margin-top: 8px;
    background: color-mix(in srgb, var(--g) 15%, transparent);
    padding: 4px 10px;

 let pts=0;if(good){G.ok++;G.cb++;pts=(G.bad?50:100)+Math.min(G.cb-1,5)*10;G.x+=pts}else G.cb=0;
 const h=$('#hp');if(h)h.style.width=(1-G.ok/G.m.qs.length)*100+'%';const ce=$('.cb');if(ce)ce.textContent=G.cb>1?'🔥 COMBO x'+G.cb:'';const xe=$('.hud span:nth-child(3)');if(xe)xe.textContent='XP +'+G.x;
 const pp=document.createElement('div');pp.className='pop'+(good?'':' r');pp.textContent=good?'+'+pts+' XP':'-1 ♥';document.body.appendChild(pp);setTimeout(()=>pp.remove(),950);if(!good){const bx=$('.box');bx&&bx.classList.add('shk')}

}

function qpick(q,z){let s=new Set;const draw=()=>{z.innerHTML=`<div class="tg">${q.t.map((t,i)=>`<button class="tl ${s.has(i)?'sel':''}" data-i="${i}"><b>${t[0]}</b>${t[1]}</button>`).join('')}</div><p><button class="btn" id="ck" ${s.size?'':'disabled style="opacity:.4"'}>VERIFIKASI</button></p>`;
 z.querySelectorAll('.tl').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;s.has(i)?s.delete(i):s.add(i);draw()});
 $('#ck').onclick=()=>{const g=q.t.every((t,i)=>!!t[2]==s.has(i));if(!g)G.l--;z.querySelectorAll('.tl').forEach((b,i)=>{b.disabled=true;b.classList.remove('sel');if(q.t[i][2])b.classList.add('ok');else if(s.has(i))b.classList.add('no')});$('#ck').remove();fin(q,g)}};draw()}
function qpath(q,z){const nodes=f=>q.n.map((n,i)=>`<div class="nd ${i==q.gap?'gp':''}" id="n${i}"><b>${i==q.gap?(f?q.o[q.a][0]:'❓'):n[0]}</b>${i==q.gap?(f?q.o[q.a][1]:'?'):n[1]}</div>`).join('<span class="ar">▶</span>');
 z.innerHTML=`<div class="pt">${nodes(0)}</div><div class="tg" id="og">${q.o.map((o,i)=>`<button class="tl" data-i="${i}"><b>${o[0]}</b>${o[1]}</button>`).join('')}</div>`;
 z.querySelectorAll('#og .tl').forEach(b=>b.onclick=()=>{const g=+b.dataset.i==q.a;z.querySelectorAll('#og .tl').forEach(x=>x.disabled=true);

  const t=P+' '+q.o[i][0]+'\n'+q.o[i][1],tm=$('#tm');let k=0;const iv=setInterval(()=>{if(!tm.isConnected)return clearInterval(iv);tm.textContent=t.slice(0,k+=3);if(k>=t.length){clearInterval(iv);fin(q,g)}},16)})}
function qtxt(q,z){z.innerHTML=`<div class="term">${q.h}</div><p><input class="inp" id="tx" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ketik jawaban lalu Enter…"> <button class="btn" id="ck">DECODE</button></p>`;
 const go=()=>{const v=$('#tx').value.trim().toLowerCase().replace(/\s+/g,' ');if(!v)return;const g=q.a.includes(v);if(!g)G.l--;$('#tx').disabled=true;$('#ck').remove();z.insertAdjacentHTML('beforeend',`<p>Jawaban: <b>${q.a[0]}</b></p>`);fin(q,g)};
